<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Padel Manager - Gestion Club & Comptes</title>
    <meta name="description" content="Application de gestion de club de padel avec planning de saison, présences par terrain et comptabilité des avances et dettes." />
    <meta property="og:title" content="Padel Manager - Gestion Club & Comptes" />
    <meta property="og:description" content="Application de gestion de club de padel avec planning de saison, présences par terrain et comptabilité des avances et dettes." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Favicon (onglet du navigateur) -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">

    <!-- Icône quand le site est ajouté à l'écran d'accueil (iOS) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Padel Manager">

    <!-- Manifest PWA (icônes Android + autres) -->
    <link rel="manifest" href="/manifest.json">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Écran d'ouverture (logo + balle qui rebondit, puis zoom vers l'app).
         Écrit directement ici, en HTML/CSS pur, pour qu'il s'affiche
         instantanément, avant même que le reste de l'app soit téléchargé.
         Ultra léger : aucune librairie, et le logo réutilise icon-192.png
         (la balle est découpée dans la même image, rien à télécharger en plus).
         C'est src/lib/splash.js qui le fait disparaître quand l'app est prête. -->
    <style>
      #pm-splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#14334F;transition:opacity .55s ease .15s}
      #pm-splash .pm-sp-logo{position:relative;width:128px;height:128px;background:url(/icon-192.png) center/100% 100% no-repeat;animation:pm-sp-in .5s cubic-bezier(.2,.8,.2,1) both;transition:transform .7s cubic-bezier(.55,0,.85,.35),opacity .5s ease .2s}
      #pm-splash .pm-sp-cover{position:absolute;left:24%;top:18.4%;width:15.4%;height:15.4%;border-radius:50%;background:#14334F}
      #pm-splash .pm-sp-ball{position:absolute;left:24.7%;top:19.1%;width:14.1%;height:14.1%;border-radius:50%;background:url(/icon-192.png) 28.75% 22.27%/711% 711% no-repeat;animation:pm-sp-bounce 1.1s .3s both}
      #pm-splash .pm-sp-name{margin:0;font:800 22px/1 'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;letter-spacing:-.01em;color:#fff;animation:pm-sp-in .5s .15s cubic-bezier(.2,.8,.2,1) both;transition:opacity .25s ease}
      #pm-splash .pm-sp-name span{color:#F6C159}
      #pm-splash.pm-splash-again .pm-sp-ball,#pm-splash.pm-splash-again .pm-sp-logo,#pm-splash.pm-splash-again .pm-sp-name{animation:none}
      #pm-splash.pm-splash-out{opacity:0;pointer-events:none}
      #pm-splash.pm-splash-out .pm-sp-logo{animation:none;transform:scale(9);opacity:0}
      #pm-splash.pm-splash-out .pm-sp-name{animation:none;opacity:0}
      #pm-splash.pm-splash-gone{display:none}
      @keyframes pm-sp-in{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
      @keyframes pm-sp-bounce{
        0%{transform:translateY(-320%);opacity:0;animation-timing-function:cubic-bezier(.5,0,1,1)}
        8%{opacity:1}
        42%{transform:translateY(0) scale(1.12,.85);animation-timing-function:cubic-bezier(0,0,.5,1)}
        62%{transform:translateY(-110%);animation-timing-function:cubic-bezier(.5,0,1,1)}
        80%{transform:translateY(0) scale(1.06,.92);animation-timing-function:cubic-bezier(0,0,.5,1)}
        90%{transform:translateY(-30%);animation-timing-function:cubic-bezier(.5,0,1,1)}
        100%{transform:translateY(0)}
      }
      @media (prefers-reduced-motion:reduce){
        #pm-splash .pm-sp-ball,#pm-splash .pm-sp-logo,#pm-splash .pm-sp-name{animation:none}
        #pm-splash.pm-splash-out .pm-sp-logo{transform:none}
      }
    </style>
  </head>
  <body>
    <div id="pm-splash" aria-label="Chargement de Padel Manager">
      <div class="pm-sp-logo"><div class="pm-sp-cover"></div><div class="pm-sp-ball"></div></div>
      <p class="pm-sp-name">Padel <span>Manager</span></p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
